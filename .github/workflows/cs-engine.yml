# CS Engine (Powered by Craft Studio) artefacts for CS Launcher Plus: libcs_engine.so (cs-host feature) + engine tables.
# The CS Launcher Plus build downloads the "cs-engine-latest" release assets; nothing is built locally.
name: Masterix Engine
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
    inputs:
      profile:
        description: Cargo profile (release = ThinLTO, slower; fast = no LTO)
        type: choice
        options: [release, fast]
        default: release
      abis:
        description: ABIs to build (comma separated; arm64-v8a, x86_64)
        default: arm64-v8a
      publish:
        description: Update the cs-engine-latest prerelease
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: cs-engine-${{ github.ref }}
  cancel-in-progress: true
env:
  HORIZON_TELEMETRY_URL: "off"
  CARGO_TARGET_DIR: .local/ci-target
  CARGO_TERM_COLOR: always
  # Upstream public APK whose generated engine tables match this source (tools unchanged since v0.7.6).
  # CS Engine product version (crates/cs-brand reads it at compile time); the Horizon core version stays in release.rs.
  CS_ENGINE_VERSION: 1.0.0
  CS_ENGINE_COMMIT: ${{ github.sha }}
  ENGINE_DATA_APK_URL: https://github.com/Vasysik/horizon-android/releases/download/v0.7.6/Horizon-Android-0.7.6-arm64-v8a.apk
  ENGINE_DATA_APK_SHA256: ""
jobs:
  check:
    name: Type-check (arm64-v8a, cs-host)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Android toolchain
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "ndk;28.2.13676358" "build-tools;35.0.0" > /dev/null
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cs-engine-arm64
          workspaces: ". -> .local/ci-target"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/horizon-mixins
            ~/.cargo/.horizon-mixins-rev
          key: horizon-mixins-4342a0bfbe71d4d14185528d64e496d6022f16a1
      - name: Compile native mods in (horizon-mixins)
        run: bash tools/cs_native_apply.sh
      - name: cargo check (cs-host)
        run: python3 tools/android_build.py --abi arm64-v8a --check --public --cs-host --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64"

  tests:
    name: Unit tests (host; cs-brand, core, render identity)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cs-engine-host-tests
      - name: cargo test
        run: |
          cargo test -p cs-brand -p horizon-core
          cargo test -p horizon-e4mc --lib -- opening_tests
          cargo test -p horizon-client-render --lib -- title_edition crash skins:: cs_voice::

  build:
    name: Build ${{ matrix.abi }}
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Skip ABIs not requested
        id: want
        run: |
          WANT="${{ github.event.inputs.abis || 'arm64-v8a' }}"
          if [[ ",$WANT," == *",${{ matrix.abi }},"* ]]; then echo "build=1" >> "$GITHUB_OUTPUT"; else echo "build=0" >> "$GITHUB_OUTPUT"; fi
      - name: Install Android toolchain
        if: steps.want.outputs.build == '1'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "ndk;28.2.13676358" "build-tools;35.0.0" > /dev/null
          rustup show active-toolchain || rustup toolchain install
          rustup target add "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@v2
        if: steps.want.outputs.build == '1'
        with:
          shared-key: cs-engine-${{ matrix.abi }}
          workspaces: ". -> .local/ci-target"
      - uses: actions/cache@v4
        if: steps.want.outputs.build == '1'
        with:
          path: |
            ~/.cargo/bin/horizon-mixins
            ~/.cargo/.horizon-mixins-rev
          key: horizon-mixins-4342a0bfbe71d4d14185528d64e496d6022f16a1
      - name: Compile native mods in (horizon-mixins)
        if: steps.want.outputs.build == '1'
        run: bash tools/cs_native_apply.sh
      - name: Build libcs_engine.so (cs-host)
        if: steps.want.outputs.build == '1'
        env:
          PROFILE: ${{ github.event.inputs.profile || 'release' }}
        run: |
          python3 tools/android_build.py --abi "${{ matrix.abi }}" --public --rust-only --cs-host --profile "$PROFILE" --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64"
      - name: Strip and collect
        if: steps.want.outputs.build == '1'
        env:
          PROFILE: ${{ github.event.inputs.profile || 'release' }}
        run: |
          set -e
          NDK="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          LIB=".local/ci-target/${{ matrix.target }}/$PROFILE/libcs_engine.so"
          test -f "$LIB"
          mkdir -p "out/${{ matrix.abi }}" symbols
          cp "$LIB" "out/${{ matrix.abi }}/libcs_engine.so"
          "$NDK/llvm-objcopy" --only-keep-debug "$LIB" "symbols/libcs_engine-${{ matrix.abi }}.debug"
          "$NDK/llvm-strip" --strip-unneeded "out/${{ matrix.abi }}/libcs_engine.so"
          "$NDK/llvm-readelf" -h "out/${{ matrix.abi }}/libcs_engine.so" | grep -E "Class|Machine"
          "$NDK/llvm-nm" -D "out/${{ matrix.abi }}/libcs_engine.so" | grep -cE "ANativeActivity_onCreate|Java_com_craftstudio_cslauncher_engine_horizon_HorizonNative_nativeInstall|Java_com_craftstudio_cslauncher_engine_horizon_HorizonNative_nativeHostSkin" | grep -qx 3 || { echo "::error::bridge symbols missing"; exit 1; }
          E4MC=".local/ci-target/${{ matrix.target }}/$PROFILE/libcs_e4mc.so"
          test -f "$E4MC"
          cp "$E4MC" "out/${{ matrix.abi }}/libcs_e4mc.so"
          "$NDK/llvm-strip" --strip-unneeded "out/${{ matrix.abi }}/libcs_e4mc.so"
          "$NDK/llvm-nm" -D "out/${{ matrix.abi }}/libcs_e4mc.so" | grep -q "Java_com_craftstudio_cslauncher_e4mc_E4mcNative_nativeStart" || { echo "::error::cs_e4mc symbols missing"; exit 1; }
          cp cs-native-mods.json "out/${{ matrix.abi }}/" 2>/dev/null || true
          ls -l "out/${{ matrix.abi }}" symbols
      # No Actions artifacts: they count against the account's 500 MB storage quota and GitHub
      # switches Actions off for the repo once it is exceeded. Everything goes straight to the
      # cs-engine-latest release (release assets are free), from this very job.
      - name: Engine tables + notices (from the pinned upstream public APK)
        if: steps.want.outputs.build == '1'
        run: |
          set -e
          curl -fsSL -o upstream.apk "$ENGINE_DATA_APK_URL"
          if [ -n "$ENGINE_DATA_APK_SHA256" ]; then echo "$ENGINE_DATA_APK_SHA256  upstream.apk" | sha256sum -c -; fi
          unzip -o -q upstream.apk assets/engine-data.zip
          mkdir -p release
          mv assets/engine-data.zip release/engine-data.zip
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('release/engine-data.zip'); names = z.namelist()
          assert 'horizon-resources.json' in names and 'registries.json' in names, names[:10]
          print(len(names), 'engine table files')
          PY
          cp LICENSE release/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md release/THIRD_PARTY_NOTICES.md
      - name: Assemble release files
        if: steps.want.outputs.build == '1'
        run: |
          set -e
          cp "out/${{ matrix.abi }}/libcs_engine.so" "release/libcs_engine-${{ matrix.abi }}.so"
          cp "out/${{ matrix.abi }}/libcs_e4mc.so" "release/libcs_e4mc-${{ matrix.abi }}.so"
          cp symbols/*.debug release/
          cp cs-native-mods.json release/ 2>/dev/null || true
          VERSION=$(grep -oP "versionName '\K[^']+" packaging/android/build.gradle | head -1)
          (cd release && sha256sum * > SHA256SUMS.txt)
          python3 - "$VERSION" <<'PY'
          import json, sys, hashlib, os
          files = {n: hashlib.sha256(open('release/'+n,'rb').read()).hexdigest() for n in sorted(os.listdir('release')) if n != 'SHA256SUMS.txt'}
          json.dump({"schema": 1, "engine": "cs-engine", "name": "Masterix Engine", "tagline": "Powered by AbhayTheMaster", "cs_engine_version": os.environ.get("CS_ENGINE_VERSION"), "lib": "libcs_engine.so", "version": sys.argv[1], "minecraft": "26.3",
                     "commit": os.environ.get("GITHUB_SHA"), "run": os.environ.get("GITHUB_RUN_NUMBER"),
                     "feature": "cs-host", "files": files}, open('release/BUILD.json','w'), indent=2)
          PY
          ls -l release
      - name: Drop stale assets from cs-engine-latest
        if: ${{ steps.want.outputs.build == '1' && (github.event_name == 'push' || github.event.inputs.publish == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may not exist yet (a fresh repository): nothing to drop then.
          ids=$(gh api "repos/${{ github.repository }}/releases/tags/cs-engine-latest" --jq '.assets[].id' 2>/dev/null) || ids=""
          for id in $ids; do
            if gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" >/dev/null; then
              echo "deleted asset $id"
            else
              echo "could not delete asset $id"
            fi
          done
          true
      - name: Update cs-engine-latest prerelease
        if: ${{ steps.want.outputs.build == '1' && (github.event_name == 'push' || github.event.inputs.publish == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cs-engine-latest
          name: Masterix Engine build ${{ github.run_number }}
          prerelease: true
          body: |
            Masterix Engine ${{ env.CS_ENGINE_VERSION }} (Powered by AbhayTheMaster) for Masterix Plus, built from `${{ github.sha }}`.
            Files: `libcs_engine-<abi>.so` (stripped), `*.debug` symbols, `engine-data.zip`, `cs-native-mods.json`, notices, `BUILD.json`, `SHA256SUMS.txt`.
            Built on Horizon Android (https://github.com/Vasysik/horizon-android, MIT). Minecraft resources are downloaded on the device from official sources only.
          files: release/*
